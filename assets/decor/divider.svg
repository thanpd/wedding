<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 34" width="260" height="34" role="img" aria-label="Hoạ tiết ngăn cách">
  <defs>
    <!-- Một nhành lá mọc về bên phải, dùng lại hai lần (bên trái lật gương) -->
    <g id="sprig">
      <path d="M0 0C8 0 16-1 25-2" fill="none" stroke="#c9a3ab" stroke-width="1" stroke-linecap="round"/>
      <g fill="#c9a3ab" opacity=".55">
        <ellipse cx="7"  cy="-5"   rx="6"   ry="2.4" transform="rotate(-32 7 -5)"/>
        <ellipse cx="7"  cy="4.6"  rx="6"   ry="2.4" transform="rotate(32 7 4.6)"/>
        <ellipse cx="15" cy="-6.4" rx="5.4" ry="2.2" transform="rotate(-34 15 -6.4)"/>
        <ellipse cx="15" cy="3.6"  rx="5.4" ry="2.2" transform="rotate(34 15 3.6)"/>
        <ellipse cx="23" cy="-6.6" rx="4.4" ry="1.8" transform="rotate(-36 23 -6.6)"/>
        <ellipse cx="23" cy="2.8"  rx="4.4" ry="1.8" transform="rotate(36 23 2.8)"/>
      </g>
    </g>
  </defs>

  <!-- hai đường ngang mảnh -->
  <g stroke="#c9a3ab" stroke-width="1" stroke-linecap="round" opacity=".5">
    <path d="M6 17h82"/>
    <path d="M172 17h82"/>
  </g>

  <use href="#sprig" transform="translate(116 17) scale(-1 1)"/>
  <use href="#sprig" transform="translate(144 17)"/>

  <!-- viên kim cương nhỏ ở giữa -->
  <path d="M130 10.5l5.6 6.5-5.6 6.5-5.6-6.5z" fill="none" stroke="#7b1327" stroke-width="1.1"/>
  <circle cx="130" cy="17" r="1.5" fill="#7b1327"/>
</svg>
